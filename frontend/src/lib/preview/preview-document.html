<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
        background: #f3f4f6;
        color: #111827;
      }
      .page {
        max-width: 960px;
        margin: 32px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.1);
      }
      .hero {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 24px;
        align-items: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #e0f2fe;
        color: #0369a1;
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 32px;
      }
      .card {
        padding: 16px;
        background: #f8fafc;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 18px;
        border-radius: 12px;
        background: #0f172a;
        color: #f8fafc;
        font-weight: 600;
        text-decoration: none;
      }
      .pp-hover {
        outline: 2px solid #22c55e !important;
        outline-offset: 2px !important;
      }
      .pp-selected {
        outline: 2px solid #16a34a !important;
        outline-offset: 2px !important;
      }
    </style>
  </head>
  <body>
    <main class="page" id="main-page">
      <section class="hero" id="hero">
        <div>
          <div class="badge" id="badge">Editor mode</div>
          <h1 class="headline" id="headline">Design faster with Page Proxy</h1>
          <p class="lead" id="lead">
            Inspect live layouts, pinpoint elements, and turn them into reusable
            components without leaving your workflow.
          </p>
          <a class="cta" id="cta" href="#">Start selecting</a>
        </div>
        <div class="preview-stack" id="preview-stack">
          <div class="card" id="card-one">Snapshot A</div>
          <div class="card" id="card-two">Snapshot B</div>
          <div class="card" id="card-three">Snapshot C</div>
        </div>
      </section>
      <section class="card-grid" id="card-grid">
        <div class="card feature-card" id="feature-one">Component map</div>
        <div class="card feature-card" id="feature-two">Style tokens</div>
        <div class="card feature-card" id="feature-three">Layer controls</div>
      </section>
    </main>
    <script>
      __PENPAL_BUNDLE__
    </script>
    <script>
      const { connect, WindowMessenger } = window.Penpal;
      const hoverClass = 'pp-hover';
      const selectedClass = 'pp-selected';
      let selectionEnabled = false;
      let hovered = null;
      let selected = null;
      let parentApi = null;

      const escapeSelector = (value) => {
        if (window.CSS && typeof window.CSS.escape === 'function') {
          return window.CSS.escape(value);
        }
        return value.replace(/([!"#$%&'()*+,./:;<=>?@[\\\]^`{|}~])/g, '\\$1');
      };

      const buildSelector = (element) => {
        if (element.id) {
          return `#${escapeSelector(element.id)}`;
        }
        const parent = element.parentElement;
        if (parent && parent.id) {
          return `#${escapeSelector(parent.id)} > ${element.tagName.toLowerCase()}`;
        }
        if (element.classList && element.classList.length > 0) {
          return `.${escapeSelector(element.classList[0])}`;
        }
        return element.tagName.toLowerCase();
      };

      const getInfo = (element) => {
        const rect = element.getBoundingClientRect();
        return {
          tag: element.tagName.toLowerCase(),
          id: element.id || null,
          name: element.getAttribute('name'),
          className: element.className || null,
          selector: buildSelector(element),
          boundingBox: {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height
          }
        };
      };

      const clearHover = () => {
        if (hovered) {
          hovered.classList.remove(hoverClass);
          hovered = null;
        }
      };

      window.addEventListener(
        'mousemove',
        (event) => {
          if (!selectionEnabled) return;
          if (!parentApi) return;
          const target = event.target;
          if (!(target instanceof Element)) return;
          if (hovered && hovered !== target) {
            hovered.classList.remove(hoverClass);
          }
          hovered = target;
          hovered.classList.add(hoverClass);
          parentApi.handleHover(getInfo(target));
        },
        {capture: true}
      );

      window.addEventListener(
        'click',
        (event) => {
          if (!selectionEnabled) return;
          if (!parentApi) return;
          event.preventDefault();
          event.stopPropagation();
          const target = event.target;
          if (!(target instanceof Element)) return;
          if (selected && selected !== target) {
            selected.classList.remove(selectedClass);
          }
          selected = target;
          selected.classList.add(selectedClass);
          parentApi.handleSelect(getInfo(target));
        },
        {capture: true}
      );

      const messenger = new WindowMessenger({
        remoteWindow: window.parent,
        allowedOrigins: ['null', window.location.origin]
      });
      const connection = connect({
        messenger,
        methods: {
          setSelectionEnabled(enabled) {
            selectionEnabled = enabled === true;
            if (!selectionEnabled) {
              clearHover();
            }
          }
        }
      });
      connection.promise.then((parent) => {
        parentApi = parent;
      });
    </script>
  </body>
</html>
