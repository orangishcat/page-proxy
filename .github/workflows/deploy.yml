name: GitHub Pages deployment

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          cd docs-site
          bun install

      - name: Build website
        run: bun run web:build

      - name: Build docs site
        run: bun run docs:build

      - name: Prepare Pages artifact
        run: |
          mkdir -p web/pages-artifact
          if [ -d web/build ]; then
            cp -R web/build/. web/pages-artifact/
          fi
          website_file_count=$(find web/pages-artifact -type f | wc -l)
          if [ "$website_file_count" -eq 0 ]; then
            echo "No website build files found in web/build"
            exit 1
          fi
          mkdir -p web/pages-artifact/docs
          if [ -d docs-site/build ]; then
            cp -R docs-site/build/. web/pages-artifact/docs/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/pages-artifact

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
