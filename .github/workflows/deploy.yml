name: Deploy website to GitHub Pages

on:
    push:
        branches:
            - main
            - master
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: |
                  bun install --frozen-lockfile
                  cd docs-site
                  bun install --frozen-lockfile

            - name: Build website
              run: bun run web:build

            - name: Build docs site
              run: bun run docs:build

            - name: Prepare Pages artifact
              run: |
                  mkdir -p web/pages-artifact
                  if [ -d web/build/client ]; then
                    cp -R web/build/client/. web/pages-artifact/
                  fi
                  if [ -d web/build/prerendered/pages ]; then
                    cp -R web/build/prerendered/pages/. web/pages-artifact/
                  fi
                  if [ -d web/build/prerendered/dependencies ]; then
                    cp -R web/build/prerendered/dependencies/. web/pages-artifact/
                  fi
                  mkdir -p web/pages-artifact/docs
                  if [ -d docs-site/build ]; then
                    cp -R docs-site/build/. web/pages-artifact/docs/
                  fi

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: web/pages-artifact

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
