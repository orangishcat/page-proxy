name: Draft release from artifacts

on:
    workflow_dispatch:
        inputs:
            version_bump:
                description: Version bump for release tag
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major

permissions:
    contents: write
    actions: read

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve build workflow run ID for latest commit
              id: resolve_build_run
              uses: actions/github-script@v7
              with:
                  script: |
                      const { owner, repo } = context.repo;

                      const repoInfo = await github.rest.repos.get({ owner, repo });
                      const defaultBranch = repoInfo.data.default_branch;

                      const latestCommit = await github.rest.repos.listCommits({
                        owner,
                        repo,
                        sha: defaultBranch,
                        per_page: 1
                      });

                      const latestSha = latestCommit.data[0]?.sha;
                      if (!latestSha) {
                        core.setFailed(`Could not resolve latest commit SHA for branch ${defaultBranch}.`);
                        return;
                      }

                      const runs = await github.rest.actions.listWorkflowRuns({
                        owner,
                        repo,
                        workflow_id: "build.yml",
                        branch: defaultBranch,
                        per_page: 50
                      });

                      const matchingRun = runs.data.workflow_runs.find((run) =>
                        run.head_sha === latestSha &&
                        run.status === "completed" &&
                        run.conclusion === "success"
                      );

                      if (!matchingRun) {
                        core.setFailed(
                          `No successful completed build.yml run found for latest commit ${latestSha} on ${defaultBranch}.`
                        );
                        return;
                      }

                      core.setOutput("build_run_id", String(matchingRun.id));
                      core.info(`Using build workflow run ID ${matchingRun.id} for commit ${latestSha}.`);

            - name: Download artifacts from selected build workflow run
              uses: dawidd6/action-download-artifact@v6
              with:
                  run_id: ${{ steps.resolve_build_run.outputs.build_run_id }}
                  workflow: build.yml
                  path: artifacts
                  skip_unpack: true

            - name: Unzip and select assets
              run: |
                  set -euo pipefail

                  mkdir -p release-assets/unpacked release-assets/final

                  # Unzip only extension package artifacts (CRX/XPI), not source artifacts.
                  find artifacts -type f \( -name "*.crx.zip" -o -name "*.xpi.zip" \) -print0 |
                    while IFS= read -r -d '' archive; do
                      unzip -q "$archive" -d release-assets/unpacked
                    done

                  find release-assets/unpacked -type f \( -name "*.xpi" -o -name "*.crx" \) \
                    -exec cp "{}" release-assets/final/ \;

                  asset_count="$(find release-assets/final -type f | wc -l | tr -d '[:space:]')"
                  if [ "$asset_count" -ne 2 ]; then
                    echo "Expected exactly 2 release assets (.crx and .xpi), found: $asset_count"
                    find release-assets/final -maxdepth 1 -type f -print
                    exit 1
                  fi

            - name: Calculate next version tag
              id: tag
              uses: mathieudutour/github-tag-action@v6.2
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  default_bump: ${{ inputs.version_bump }}

            - name: Create draft release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.new_tag }}
                  name: ${{ steps.tag.outputs.new_tag }}
                  draft: true
                  files: |
                      release-assets/final/*
