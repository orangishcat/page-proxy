name: Draft release from artifacts

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve project version
        run: |
          PROJECT_VERSION="$(jq -r '.version' package.json)"
          PROJECT_VERSION="${PROJECT_VERSION/#v/}" && PROJECT_VERSION="v$PROJECT_VERSION"   # append v if missing (1.2.3 -> v1.2.3)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Resolve build workflow run ID for latest commit
        id: resolve_build_run
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;

            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;

            const latestCommit = await github.rest.repos.listCommits({
              owner,
              repo,
              sha: defaultBranch,
              per_page: 1
            });

            const latestSha = latestCommit.data[0]?.sha;
            if (!latestSha) {
              core.setFailed(`Could not resolve latest commit SHA for branch ${defaultBranch}.`);
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "build.yml",
              branch: defaultBranch,
              per_page: 50
            });

            const matchingRun = runs.data.workflow_runs.find((run) =>
              run.head_sha === latestSha &&
              run.status === "completed" &&
              run.conclusion === "success"
            );

            if (!matchingRun) {
              core.setFailed(
                `No successful completed build.yml run found for latest commit ${latestSha} on ${defaultBranch}.`
              );
              return;
            }

            core.setOutput("build_run_id", String(matchingRun.id));
            core.info(`Using build workflow run ID ${matchingRun.id} for commit ${latestSha}.`);

      - name: Download artifacts from selected build workflow run
        uses: dawidd6/action-download-artifact@v19
        with:
          run_id: ${{ steps.resolve_build_run.outputs.build_run_id }}
          workflow: build.yml
          path: artifacts
          skip_unpack: true

      - name: Collect assets and extract extension packages
        run: |
          set -euo pipefail

          mkdir -p release-assets/unpacked release-assets/final

          shopt -s nullglob globstar

          chrome_crx_archive=(artifacts/**/pp-chrome-crx-*.crx.zip)
          chrome_source_zip=(artifacts/**/pp-chrome-source-*.zip)
          ff_xpi_archive=(artifacts/**/pp-ff-xpi-*.xpi.zip)
          ff_source_zip=(artifacts/**/pp-ff-source-*.zip)

          if [ "${#chrome_crx_archive[@]}" -ne 1 ]; then
            echo "Expected exactly 1 archive matching pp-chrome-crx-*.crx.zip, found: ${#chrome_crx_archive[@]}"
            exit 1
          fi
          if [ "${#chrome_source_zip[@]}" -ne 1 ]; then
            echo "Expected exactly 1 archive matching pp-chrome-source-*.zip, found: ${#chrome_source_zip[@]}"
            exit 1
          fi
          if [ "${#ff_xpi_archive[@]}" -ne 1 ]; then
            echo "Expected exactly 1 archive matching pp-ff-xpi-*.xpi.zip, found: ${#ff_xpi_archive[@]}"
            exit 1
          fi
          if [ "${#ff_source_zip[@]}" -ne 1 ]; then
            echo "Expected exactly 1 archive matching pp-ff-source-*.zip, found: ${#ff_source_zip[@]}"
            exit 1
          fi

          cp "${chrome_source_zip[0]}" release-assets/final/
          cp "${ff_source_zip[0]}" release-assets/final/

          unzip -q "${chrome_crx_archive[0]}" -d release-assets/unpacked
          unzip -q "${ff_xpi_archive[0]}" -d release-assets/unpacked

          chrome_crx_file=(release-assets/unpacked/**/pp-chrome-crx-*.crx)
          ff_xpi_file=(release-assets/unpacked/**/pp-ff-xpi-*.xpi)

          if [ "${#chrome_crx_file[@]}" -ne 1 ]; then
            echo "Expected exactly 1 extracted file matching pp-chrome-crx-*.crx, found: ${#chrome_crx_file[@]}"
            exit 1
          fi
          if [ "${#ff_xpi_file[@]}" -ne 1 ]; then
            echo "Expected exactly 1 extracted file matching pp-ff-xpi-*.xpi, found: ${#ff_xpi_file[@]}"
            exit 1
          fi

          cp "${chrome_crx_file[0]}" release-assets/final/
          cp "${ff_xpi_file[0]}" release-assets/final/

          total_asset_count="$(find release-assets/final -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [ "$total_asset_count" -ne 4 ]; then
            echo "Expected exactly 4 release assets, found: $total_asset_count"
            find release-assets/final -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_TAG }}
          draft: true
          files: |
            release-assets/final/*
