name: Checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  web-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Sync SvelteKit # (generates .svelte-kit/tsconfig.json)
        run: cd web && bunx svelte-kit sync

      - name: Lint
        run: bun run web:lint && bun run extension:lint

      - name: Typecheck
        run: bun run web:check && bun run extension:check
