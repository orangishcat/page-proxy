name: Checks

on:
    pull_request:
    push:

jobs:
    website-checks:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Lint
              run: bun run web:lint

            - name: Typecheck
              run: bun run web:check

            - name: Build
              run: bun run web:build

            - name: Page load check
              working-directory: web
              env:
                  PAGE_LOAD_PATHS: "/,/app/dashboard"
              run: bun run test
